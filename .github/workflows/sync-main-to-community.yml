name: Sync main to community

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout community
        uses: actions/checkout@v4
        with:
          ref: community
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into community
        run: |
          git fetch origin main
          if git merge origin/main --no-edit -m "chore: sync main into community"; then
            git push origin community
            echo "Merged cleanly."
          else
            git merge --abort || true
            echo "::error::Merge conflict between main and community. Resolve manually:"
            echo "  git checkout community && git merge origin/main"
            exit 1
          fi
